<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TOM SAINT // INDUSTRIAL STEM PLAYER</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    /* Custom Industrial Accents */

    .hazard-bar {

      background: repeating-linear-gradient(45deg, #dc2626, #dc2626 12px, #18181b 12px, #18181b 24px);

    }

    input[type=range]::-webkit-slider-thumb {

      appearance: none;

      width: 14px;

      height: 14px;

      border-radius: 50%;

      cursor: pointer;

      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);

    }

  </style>

</head>

<body class="bg-zinc-950 text-zinc-100 flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 font-mono select-none">



  <!-- Audio Elements pointing directly to your assets/audio/ folder -->

  <audio id="audio-0" src="assets/audio/drums.mp3" preload="auto" loop></audio>

  <audio id="audio-1" src="assets/audio/bass.mp3" preload="auto" loop></audio>

  <audio id="audio-2" src="assets/audio/guitar.mp3" preload="auto" loop></audio>

  <audio id="audio-3" src="assets/audio/synth.mp3" preload="auto" loop></audio>

  <audio id="audio-4" src="assets/audio/vox.mp3" preload="auto" loop></audio>



  <!-- One-Shot Trigger Audio Elements -->

  <audio id="sfx-airhorn" src="assets/audio/airhorn.wav" preload="auto"></audio>

  <audio id="sfx-eagle" src="assets/audio/eagle.wav" preload="auto"></audio>

  <audio id="sfx-tomsaint" src="assets/audio/tomsaint.wav" preload="auto"></audio>



  <!-- Main Rack-Mount Chassis -->

  <div class="w-full max-w-5xl bg-zinc-900 border-2 border-zinc-700/80 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] relative overflow-hidden">

    <!-- Hazard Tape Top Banner -->

    <div class="hazard-bar h-2 w-full border-b border-zinc-800"></div>



    <!-- Rack Screws -->

    <div class="absolute top-4 left-3 w-3 h-3 rounded-full bg-zinc-700 border border-zinc-500 flex items-center justify-center shadow-inner"><div class="w-1.5 h-0.5 bg-zinc-950"></div></div>

    <div class="absolute bottom-4 left-3 w-3 h-3 rounded-full bg-zinc-700 border border-zinc-500 flex items-center justify-center shadow-inner"><div class="w-1.5 h-0.5 bg-zinc-950 rotate-45"></div></div>

    <div class="absolute top-4 right-3 w-3 h-3 rounded-full bg-zinc-700 border border-zinc-500 flex items-center justify-center shadow-inner"><div class="w-1.5 h-0.5 bg-zinc-950"></div></div>

    <div class="absolute bottom-4 right-3 w-3 h-3 rounded-full bg-zinc-700 border border-zinc-500 flex items-center justify-center shadow-inner"><div class="w-1.5 h-0.5 bg-zinc-950 -rotate-45"></div></div>



    <!-- Master Transport Bar -->

    <div class="p-4 sm:px-6 bg-zinc-950/40 border-b border-zinc-800 flex flex-col md:flex-row items-center justify-between gap-4">

      <div class="flex items-center gap-3">

        <button id="btn-play" class="px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-2 border bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border-zinc-600 transition-all active:scale-95 shadow-lg">

          <span id="play-icon">▶</span> <span id="play-text">START ALL</span>

        </button>

        <button id="btn-stop" class="px-3 py-2 rounded-lg bg-zinc-800/90 hover:bg-zinc-700 border border-zinc-600 text-zinc-300 text-xs flex items-center gap-1.5 transition-colors"><span class="text-red-500">■</span> STOP

        </button>

        <button id="btn-rtz" class="p-2 rounded-lg bg-zinc-800/90 hover:bg-zinc-700 border border-zinc-600 text-zinc-400 hover:text-zinc-200 transition-colors" title="Return to Zero (RTZ)">

          ↺

        </button>

        <button id="btn-loop" class="px-2.5 py-1.5 rounded-lg border text-xs bg-emerald-500/20 text-emerald-400 border-emerald-500/40 transition-colors">

          LOOP: ON

        </button>

      </div>



      <!-- Timecode LCD & Scrub Slider -->

      <div class="flex-1 w-full max-w-md flex flex-col gap-1.5">

        <div class="flex items-center justify-between text-xs">

          <div class="flex items-center gap-2 bg-black px-2.5 py-1 rounded border border-zinc-800 text-red-500 font-bold tracking-widest shadow-inner">

            <span class="text-[10px] text-zinc-600">SMPTE</span>

            <span id="timecode-display">00:00.00</span>

          </div>

          <div class="text-zinc-500 text-[11px]">

            LEN: <span id="duration-display" class="text-zinc-300">00:00.00</span>

          </div>

        </div>

        <input id="scrub-slider" type="range" min="0" max="100" value="0" step="0.1" class="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer border border-zinc-700" />

      </div>



      <!-- Tape Speed Knob -->

      <div class="flex items-center gap-2.5 bg-black/60 border border-zinc-800 rounded-lg px-3 py-1.5">

        <div class="flex flex-col text-right">

          <span class="text-[9px] text-zinc-500 font-bold tracking-wider">TAPE SPEED</span>

          <span id="speed-display" class="text-xs font-black text-red-500">1.00x</span>

          <button id="speed-reset" class="text-[9px] text-zinc-600 hover:text-red-500 transition-colors">[1.0x]</button>

        </div>

        <div id="speed-knob" class="w-10 h-10 rounded-full bg-gradient-to-br from-zinc-700 via-zinc-850 to-zinc-950 border-2 border-zinc-500 shadow-md relative cursor-ns-resize flex items-center justify-center active:border-red-500" title="Drag up/down for Tape Varispeed">

          <div id="speed-needle" class="w-full h-full rounded-full flex justify-center pt-1 pointer-events-none">

            <div class="w-1 h-3.5 bg-red-500 rounded-full shadow-[0_0_4px_rgba(239,68,68,0.8)]"></div>

          </div>

          <div class="w-3.5 h-3.5 rounded-full bg-zinc-900 border border-zinc-600 absolute shadow-inner pointer-events-none"></div>

        </div>

      </div>

    </div>



    <!-- ONE-SHOT SAMPLE TRIGGERS -->

    <div class="px-5 sm:px-8 py-3 bg-zinc-950/70 border-b border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-4">

      <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest shrink-0">⚡ TRIGGERS</span>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">

        <!-- Airhorn -->

        <button id="trigger-airhorn" class="group relative px-4 py-3 rounded-xl bg-gradient-to-b from-red-600 via-red-700 to-red-900 border-2 border-red-400 shadow-[0_6px_16px_rgba(220,38,38,0.35)] active:scale-95 transition-all text-center">

          <div class="absolute top-1.5 right-2 px-1.5 py-0.5 rounded bg-black/60 border border-red-400/40 text-[9px] text-red-200">KEY [1]</div>

          <span class="font-bold text-xs uppercase text-white">AIRHORN</span>

        </button>

        <!-- Eagle -->

        <button id="trigger-eagle" class="group relative px-4 py-3 rounded-xl bg-gradient-to-b from-red-700 via-red-800 to-zinc-950 border-2 border-red-500 shadow-[0_6px_16px_rgba(185,28,28,0.35)] active:scale-95 transition-all text-center">

          <div class="absolute top-1.5 right-2 px-1.5 py-0.5 rounded bg-black/60 border border-red-400/40 text-[9px] text-red-200">KEY [2]</div>

          <span class="font-bold text-xs uppercase text-white">EAGLE</span>

        </button>

        <!-- Tom Saint -->

        <button id="trigger-tomsaint" class="group relative px-4 py-3 rounded-xl bg-gradient-to-b from-zinc-800 via-zinc-900 to-black border-2 border-red-500 shadow-[0_6px_16px_rgba(220,38,38,0.25)] active:scale-95 transition-all text-center">

          <div class="absolute top-1.5 right-2 px-1.5 py-0.5 rounded bg-black/60 border border-red-400/40 text-[9px] text-red-200">KEY [3]</div>

          <span class="font-bold text-xs uppercase text-red-100">TOM SAINT</span>

        </button>

      </div>

    </div>



    <!-- 6-CHANNEL MIXER SECTION -->

    <div class="p-4 sm:p-6 overflow-x-auto">

      <div class="min-w-[680px] grid grid-cols-6 gap-3 sm:gap-4 items-stretch" id="mixer-strips">

        <!-- 5 Channels dynamically populated + 1 Master -->

      </div>

    </div>



    <!-- Chassis Footer -->

    <div class="px-6 py-2.5 bg-zinc-950 border-t border-zinc-800 flex items-center justify-between text-[11px] text-zinc-500">

      <div><span class="text-red-500 font-bold">READY //</span> ASSETS FOLDER CONNECTED</div>

      <div class="text-zinc-500 font-bold tracking-wider">SAINT_OS // STEM PLAYER</div>

    </div>

  </div>



  <script>

    // Channel Data

    const TRACKS = [

      { id: 0, name: "DRUMS" },

      { id: 1, name: "BASS" },

      { id: 2, name: "GUITAR" },

      { id: 3, name: "SYNTH" },

      { id: 4, name: "VOX" }

    ];



    let isPlaying = false;

    let isLooping = true;

    let playbackSpeed = 1.0;

    let volumes = [0.85, 0.85, 0.8, 0.75, 0.9];

    let pans = [0, 0, -0.4, 0.4, 0];

    let mutes = [false, false, false, false, false];

    let solos = [false, false, false, false, false];

    let masterVol = 0.9;

    let masterMuted = false;



    // Web Audio Routing

    let audioCtx = null;

    let masterGain = null;

    let trackGains = [];

    let trackPanners = [];

    let trackAnalysers = [];

    let masterAnalyserL = null;

    let masterAnalyserR = null;



    function initAudio() {

      if (audioCtx) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = audioCtx.createGain();

      masterGain.gain.setValueAtTime(masterMuted ? 0 : masterVol, audioCtx.currentTime);



      const splitter = audioCtx.createChannelSplitter(2);

      masterAnalyserL = audioCtx.createAnalyser();

      masterAnalyserR = audioCtx.createAnalyser();

      masterAnalyserL.fftSize = 64;

      masterAnalyserR.fftSize = 64;



      masterGain.connect(splitter);

      splitter.connect(masterAnalyserL, 0);

      splitter.connect(masterAnalyserR, 1);

      masterGain.connect(audioCtx.destination);



      TRACKS.forEach((t, i) => {

        const audioEl = document.getElementById(`audio-${i}`);

        const gain = audioCtx.createGain();

        const panner = audioCtx.createStereoPanner();

        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 64;



        try {

          const source = audioCtx.createMediaElementSource(audioEl);

          source.connect(gain);

        } catch(e) {}



        gain.connect(panner);

        panner.connect(analyser);

        analyser.connect(masterGain);



        trackGains.push(gain);

        trackPanners.push(panner);

        trackAnalysers.push(analyser);

      });

      updateAudioNodes();

    }



    function updateAudioNodes() {

      if (!audioCtx) return;

      const anySolo = solos.some(s => s);

      TRACKS.forEach((_, i) => {

        let effVol = volumes[i];

        if (mutes[i] || (anySolo && !solos[i])) effVol = 0;

        trackGains[i]?.gain.setTargetAtTime(effVol, audioCtx.currentTime, 0.02);

        trackPanners[i]?.pan.setTargetAtTime(pans[i], audioCtx.currentTime, 0.02);

      });

      masterGain?.gain.setTargetAtTime(masterMuted ? 0 : masterVol, audioCtx.currentTime, 0.02);

    }

    // Apply true tape-style varispeed to all stems.
    // Disabling pitch preservation makes pitch rise/fall with playback speed.
    function setTapeSpeed(speed) {
      playbackSpeed = Math.max(0.5, Math.min(1.5, speed));

      TRACKS.forEach((_, i) => {
        const audio = document.getElementById(`audio-${i}`);
        audio.preservesPitch = false;
        audio.mozPreservesPitch = false;
        audio.webkitPreservesPitch = false;
        audio.playbackRate = playbackSpeed;
      });
    }



    // Start at normal speed with pitch preservation disabled.
    setTapeSpeed(1.0);

    // Render Strips

    const container = document.getElementById("mixer-strips");

    TRACKS.forEach((track, i) => {

      const col = document.createElement("div");

      col.className = "flex flex-col bg-zinc-950/90 rounded-lg border-2 border-zinc-800 p-2.5 relative";

      col.id = `strip-${i}`;

      col.innerHTML = `

        <div class="border-b border-zinc-800 pb-2 mb-2 text-center">

          <div class="text-[10px] text-zinc-500 mb-0.5">CH-0${i + 1}</div>

          <div class="font-bold text-[11px] tracking-wider uppercase text-zinc-100">${track.name}</div>

        </div>

        <div class="mb-3 px-1">

          <div class="flex justify-between text-[10px] text-zinc-400 mb-1">

            <span>PAN</span><span id="pan-val-${i}">C</span>

          </div>

          <div id="pan-knob-${i}" class="h-5 bg-zinc-900 border border-zinc-700 rounded relative cursor-ew-resize flex items-center justify-center">

            <div class="absolute top-0 bottom-0 w-0.5 bg-zinc-700 left-1/2 -translate-x-1/2"></div>

            <div id="pan-puck-${i}" class="w-3 h-3 rounded-full bg-red-600 border border-red-400"></div>

          </div>

        </div>

        <div class="grid grid-cols-2 gap-1.5 mb-3 text-xs font-bold">

          <button id="solo-${i}" class="py-1 rounded border bg-zinc-900 text-zinc-400 border-zinc-800">SOLO</button>

          <button id="mute-${i}" class="py-1 rounded border bg-zinc-900 text-zinc-400 border-zinc-800">MUTE</button>

        </div>

        <div class="flex-1 min-h-[220px] flex items-center justify-center gap-2 py-1 relative">

          <div class="flex flex-col justify-between h-full text-[9px] text-zinc-600 text-right pr-0.5 select-none">

            <span>+6</span><span>0</span><span>-6</span><span>-12</span><span>-24</span><span>-∞</span>

          </div>

          <div id="fader-track-${i}" class="w-8 h-full bg-zinc-950 border-2 border-zinc-800 rounded-md relative flex justify-center cursor-ns-resize shadow-inner">

            <div class="w-1.5 h-full bg-black rounded-full"></div>

            <div id="fader-handle-${i}" class="absolute w-7 h-9 bg-gradient-to-b from-zinc-600 via-zinc-700 to-zinc-900 border border-zinc-400 rounded shadow pointer-events-none -translate-y-1/2 flex flex-col items-center justify-center" style="top: 15%">

              <div class="w-5 h-0.5 bg-red-500 mb-1"></div>

              <div class="w-4 h-0.5 bg-zinc-400"></div>

            </div>

          </div>

          <div id="meter-${i}" class="w-3.5 h-full bg-black border border-zinc-800 rounded p-0.5 flex flex-col-reverse justify-between gap-0.5">

            ${Array.from({length: 14}).map((_, idx) => `<div class="w-full h-1 rounded-xs bg-zinc-900" id="led-${i}-${idx}"></div>`).join('')}

          </div>

        </div>

        <div class="mt-3 pt-2 border-t border-zinc-800 text-center font-bold text-xs text-red-500" id="vol-val-${i}">85%</div>

      `;

      container.appendChild(col);

    });



    // Add Master Strip

    const masterCol = document.createElement("div");

    masterCol.className = "flex flex-col bg-zinc-950/95 rounded-lg border-2 border-red-600/60 p-2.5 relative";

    masterCol.innerHTML = `

      <div class="border-b border-zinc-800 pb-2 mb-2 text-center">

        <div class="text-[10px] text-red-500 mb-0.5">OUT // 2CH</div>

        <div class="font-bold text-[11px] tracking-wider uppercase text-red-500">MASTER</div>

      </div>

      <div class="mb-3">

        <button id="master-mute" class="w-full py-1.5 rounded text-xs font-bold border bg-zinc-900 text-zinc-300 border-zinc-700">MAIN ON</button>

      </div>

      <div class="flex-1 min-h-[220px] flex items-center justify-center gap-1.5 py-1 relative">

        <div class="flex flex-col justify-between h-full text-[9px] text-zinc-600 text-right pr-0.5 select-none">

          <span>+6</span><span>0</span><span>-6</span><span>-12</span><span>-24</span><span>-∞</span>

        </div>

        <div id="master-fader-track" class="w-9 h-full bg-zinc-950 border-2 border-amber-900/40 rounded-md relative flex justify-center cursor-ns-resize shadow-inner">

          <div class="w-1.5 h-full bg-black rounded-full"></div>

          <div id="master-fader-handle" class="absolute w-8 h-9 bg-gradient-to-b from-red-600 via-zinc-800 to-black border-2 border-red-500 rounded shadow pointer-events-none -translate-y-1/2 flex flex-col items-center justify-center" style="top: 10%">

            <div class="w-6 h-0.5 bg-red-400 mb-1"></div>

            <div class="w-5 h-0.5 bg-zinc-400"></div>

          </div>

        </div>

        <div class="flex gap-1 h-full">

          <div class="w-2.5 h-full bg-black border border-zinc-800 rounded p-0.5 flex flex-col-reverse justify-between gap-0.5">

            ${Array.from({length: 14}).map((_, idx) => `<div class="w-full h-1 rounded-xs bg-zinc-900" id="mled-l-${idx}"></div>`).join('')}

          </div>

          <div class="w-2.5 h-full bg-black border border-zinc-800 rounded p-0.5 flex flex-col-reverse justify-between gap-0.5">

            ${Array.from({length: 14}).map((_, idx) => `<div class="w-full h-1 rounded-xs bg-zinc-900" id="mled-r-${idx}"></div>`).join('')}

          </div>

        </div>

      </div>

      <div class="mt-3 pt-2 border-t border-zinc-800 text-center font-bold text-xs text-red-500" id="master-vol-val">90%</div>

    `;

    container.appendChild(masterCol);



    // Event Wireups

    document.getElementById("btn-play").addEventListener("click", () => {

      initAudio();

      if (audioCtx.state === "suspended") audioCtx.resume();

      isPlaying = !isPlaying;

      document.getElementById("play-icon").textContent = isPlaying ? "⏸" : "▶";

      document.getElementById("play-text").textContent = isPlaying ? "PAUSE" : "START ALL";

      document.getElementById("btn-play").className = isPlaying ? 

        "px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-2 border bg-red-600 text-white border-red-400 shadow-red-600/30 transition-all active:scale-95" :

        "px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-2 border bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border-zinc-600 transition-all active:scale-95";



      TRACKS.forEach((_, i) => {

        const el = document.getElementById(`audio-${i}`);

        if (isPlaying) el.play().catch(()=>{});

        else el.pause();

      });

    });



    document.getElementById("btn-stop").addEventListener("click", () => {

      isPlaying = false;

      document.getElementById("play-icon").textContent = "▶";

      document.getElementById("play-text").textContent = "START ALL";

      TRACKS.forEach((_, i) => {

        const el = document.getElementById(`audio-${i}`);

        el.pause();

        el.currentTime = 0;

      });

    });



    document.getElementById("btn-rtz").addEventListener("click", () => {

      TRACKS.forEach((_, i) => { document.getElementById(`audio-${i}`).currentTime = 0; });

    });



    // Fader & Mute / Solo Wireup

    TRACKS.forEach((_, i) => {

      const trackEl = document.getElementById(`fader-track-${i}`);

      const handleEl = document.getElementById(`fader-handle-${i}`);

      const volValEl = document.getElementById(`vol-val-${i}`);



      const setFader = (clientY) => {

        const rect = trackEl.getBoundingClientRect();

        const norm = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

        volumes[i] = norm;

        handleEl.style.top = `${(1 - norm) * 100}%`;

        volValEl.textContent = `${Math.round(norm * 100)}%`;

        updateAudioNodes();

      };



      trackEl.addEventListener("pointerdown", (e) => {

        trackEl.setPointerCapture(e.pointerId);

        setFader(e.clientY);

        const onMove = (ev) => setFader(ev.clientY);

        const onUp = () => {

          trackEl.removeEventListener("pointermove", onMove);

          trackEl.removeEventListener("pointerup", onUp);

        };

        trackEl.addEventListener("pointermove", onMove);

        trackEl.addEventListener("pointerup", onUp);

      });



      // Pan

      const panKnob = document.getElementById(`pan-knob-${i}`);

      const panPuck = document.getElementById(`pan-puck-${i}`);

      const panText = document.getElementById(`pan-val-${i}`);

      panKnob.addEventListener("pointerdown", (e) => {

        panKnob.setPointerCapture(e.pointerId);

        let startY = e.clientY;

        const onMove = (ev) => {

          pans[i] = Math.max(-1, Math.min(1, pans[i] + (startY - ev.clientY) * 0.02));

          startY = ev.clientY;

          panPuck.style.transform = `translateX(${pans[i] * 20}px)`;

          panText.textContent = pans[i] === 0 ? "C" : pans[i] < 0 ? `L${Math.round(Math.abs(pans[i])*100)}` : `R${Math.round(pans[i]*100)}`;

          updateAudioNodes();

        };

        const onUp = () => {

          panKnob.removeEventListener("pointermove", onMove);

          panKnob.removeEventListener("pointerup", onUp);

        };

        panKnob.addEventListener("pointermove", onMove);

        panKnob.addEventListener("pointerup", onUp);

      });



      // Mute / Solo

      document.getElementById(`mute-${i}`).addEventListener("click", () => {

        mutes[i] = !mutes[i];

        document.getElementById(`mute-${i}`).className = mutes[i] ? "py-1 rounded border bg-red-600 text-white border-red-400" : "py-1 rounded border bg-zinc-900 text-zinc-400 border-zinc-800";

        updateAudioNodes();

      });



      document.getElementById(`solo-${i}`).addEventListener("click", () => {

        solos[i] = !solos[i];

        document.getElementById(`solo-${i}`).className = solos[i] ? "py-1 rounded border bg-red-600 text-white border-red-400" : "py-1 rounded border bg-zinc-900 text-zinc-400 border-zinc-800";

        updateAudioNodes();

      });

    });



    // Master Fader

    const mFaderTrack = document.getElementById("master-fader-track");

    const mFaderHandle = document.getElementById("master-fader-handle");

    const mVolVal = document.getElementById("master-vol-val");

    const setMasterFader = (clientY) => {

      const rect = mFaderTrack.getBoundingClientRect();

      const norm = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

      masterVol = norm;

      mFaderHandle.style.top = `${(1 - norm) * 100}%`;

      mVolVal.textContent = `${Math.round(norm * 100)}%`;

      updateAudioNodes();

    };

    mFaderTrack.addEventListener("pointerdown", (e) => {

      mFaderTrack.setPointerCapture(e.pointerId);

      setMasterFader(e.clientY);

      const onMove = (ev) => setMasterFader(ev.clientY);

      const onUp = () => {

        mFaderTrack.removeEventListener("pointermove", onMove);

        mFaderTrack.removeEventListener("pointerup", onUp);

      };

      mFaderTrack.addEventListener("pointermove", onMove);

      mFaderTrack.addEventListener("pointerup", onUp);

    });



    // Master Mute

    document.getElementById("master-mute").addEventListener("click", () => {

      masterMuted = !masterMuted;

      document.getElementById("master-mute").textContent = masterMuted ? "MUTED" : "MAIN ON";

      document.getElementById("master-mute").className = masterMuted ? "w-full py-1.5 rounded text-xs font-bold border bg-red-600 text-white border-red-400" : "w-full py-1.5 rounded text-xs font-bold border bg-zinc-900 text-zinc-300 border-zinc-700";

      updateAudioNodes();

    });



    // Tape Speed Drag

    const speedKnob = document.getElementById("speed-knob");

    speedKnob.addEventListener("pointerdown", (e) => {

      speedKnob.setPointerCapture(e.pointerId);

      let lastY = e.clientY;

      const onMove = (ev) => {

        playbackSpeed = Math.max(0.5, Math.min(1.5, playbackSpeed + (lastY - ev.clientY) * 0.008));

        lastY = ev.clientY;

        document.getElementById("speed-display").textContent = `${playbackSpeed.toFixed(2)}x`;

        document.getElementById("speed-needle").style.transform = `rotate(${(playbackSpeed - 1.0) * 150}deg)`;

        setTapeSpeed(playbackSpeed);

      };

      const onUp = () => {

        speedKnob.removeEventListener("pointermove", onMove);

        speedKnob.removeEventListener("pointerup", onUp);

      };

      speedKnob.addEventListener("pointermove", onMove);

      speedKnob.addEventListener("pointerup", onUp);

    });

    document.getElementById("speed-reset").addEventListener("click", () => {

      playbackSpeed = 1.0;

      document.getElementById("speed-display").textContent = "1.00x";

      document.getElementById("speed-needle").style.transform = "rotate(0deg)";

      setTapeSpeed(1.0);

    });



    // One-Shot Trigger Functions (50% Volume)

    function playSfx(id) {

      initAudio();

      const el = document.getElementById(id);

      if (el) {

        el.volume = masterVol * 0.5;

        el.currentTime = 0;

        el.preservesPitch = false;
        el.mozPreservesPitch = false;
        el.webkitPreservesPitch = false;
        el.playbackRate = playbackSpeed;

        el.play().catch(()=>{});

      }

    }



    document.getElementById("trigger-airhorn").addEventListener("click", () => playSfx("sfx-airhorn"));

    document.getElementById("trigger-eagle").addEventListener("click", () => playSfx("sfx-eagle"));

    document.getElementById("trigger-tomsaint").addEventListener("click", () => playSfx("sfx-tomsaint"));



    // Keyboard Shortcuts: [1], [2], [3], [Space]

    window.addEventListener("keydown", (e) => {

      if (e.target.tagName === "INPUT") return;

      if (e.key === "1") playSfx("sfx-airhorn");

      else if (e.key === "2") playSfx("sfx-eagle");

      else if (e.key === "3") playSfx("sfx-tomsaint");

      else if (e.code === "Space") {

        e.preventDefault();

        document.getElementById("btn-play").click();

      }

    });



    // Timecode & Meter Animation Loop

    function formatTime(s) {

      const m = Math.floor(s / 60);

      const rem = Math.floor(s % 60);

      const ms = Math.floor((s % 1) * 100);

      return `${m.toString().padStart(2, '0')}:${rem.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;

    }



    const leadAudio = document.getElementById("audio-0");

    leadAudio.addEventListener("loadedmetadata", () => {

      document.getElementById("duration-display").textContent = formatTime(leadAudio.duration || 0);

      document.getElementById("scrub-slider").max = leadAudio.duration || 100;

    });



    document.getElementById("scrub-slider").addEventListener("input", (e) => {

      const t = parseFloat(e.target.value);

      TRACKS.forEach((_, i) => { document.getElementById(`audio-${i}`).currentTime = t; });

    });



    function anim() {

      if (leadAudio.duration) {

        document.getElementById("timecode-display").textContent = formatTime(leadAudio.currentTime);

        document.getElementById("scrub-slider").value = leadAudio.currentTime;

      }



      // LED meters

      if (audioCtx) {

        const data = new Uint8Array(32);

        TRACKS.forEach((_, i) => {

          const ana = trackAnalysers[i];

          let lvl = 0;

          if (ana && isPlaying && !mutes[i]) {

            ana.getByteFrequencyData(data);

            let sum = 0;

            for(let b=0; b<16; b++) sum += data[b];

            lvl = (sum / 16 / 255) * volumes[i];

          }

          for (let seg=0; seg<14; seg++) {

            const lit = lvl >= (seg + 1)/14;

            const el = document.getElementById(`led-${i}-${seg}`);

            if (el) {

              if (lit) el.className = `w-full h-1 rounded-xs ${seg >= 12 ? 'bg-red-500' : seg >= 10 ? 'bg-amber-400' : 'bg-emerald-500'}`;

              else el.className = "w-full h-1 rounded-xs bg-zinc-900";

            }

          }

        });



        // Master Meters

        if (masterAnalyserL && masterAnalyserR) {

          const lData = new Uint8Array(32);

          const rData = new Uint8Array(32);

          masterAnalyserL.getByteFrequencyData(lData);

          masterAnalyserR.getByteFrequencyData(rData);

          let lSum=0, rSum=0;

          for(let b=0; b<16; b++){ lSum += lData[b]; rSum += rData[b]; }

          const lVal = (lSum/16/255) * masterVol;

          const rVal = (rSum/16/255) * masterVol;

          for(let seg=0; seg<14; seg++){

            const litL = lVal >= (seg+1)/14;

            const litR = rVal >= (seg+1)/14;

            const elL = document.getElementById(`mled-l-${seg}`);

            const elR = document.getElementById(`mled-r-${seg}`);

            if(elL) elL.className = `w-full h-1 rounded-xs ${litL ? (seg>=12?'bg-red-500':seg>=10?'bg-amber-400':'bg-emerald-500') : 'bg-zinc-900'}`;

            if(elR) elR.className = `w-full h-1 rounded-xs ${litR ? (seg>=12?'bg-red-500':seg>=10?'bg-amber-400':'bg-emerald-500') : 'bg-zinc-900'}`;

          }

        }

      }

      requestAnimationFrame(anim);

    }

    requestAnimationFrame(anim);

  </script>

</body>
